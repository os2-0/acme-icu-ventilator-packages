    note: specific mounted occurrence, not package name
  - from_occurrence: @acme/breathing-circuit#occ.humidifier-module
    to_occurrence: @acme/breathing-circuit#occ.inspiratory-valve
    predicate: acme:connectedTo
    note: specific mounted occurrence, not package name
