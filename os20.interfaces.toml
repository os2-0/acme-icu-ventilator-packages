[[interfaces]]
id = "insp-pressure-tap"
package = "@acme/sensor-system"
owner = "SensorSystem"
name = "insp-pressure-tap"
kind = "core:interface/fluid/gas"
direction = "input"

[[interfaces]]
id = "exp-pressure-tap"
package = "@acme/sensor-system"
owner = "SensorSystem"
name = "exp-pressure-tap"
kind = "core:interface/fluid/gas"
direction = "input"

[[interfaces]]
id = "sensor-bus"
package = "@acme/sensor-system"
owner = "SensorSystem"
name = "sensor-bus"
kind = "core:interface/electrical/signal"
direction = "output"

[interfaces.properties]
protocol = "example-spi"

[[interfaces]]
id = "board-power"
package = "@acme/sensor-system"
owner = "SensorSystem"
name = "board-power"
kind = "core:interface/electrical/power"
direction = "input"

[interfaces.properties]
voltage = "5 V"

